<!DOCTYPE html>
<html>
<head>
    <title>Moving Car</title>

    <script>

        var imgObj;
        var animate;

        function init() {

            imgObj = document.getElementById("img");

            imgObj.style.position = "relative";
            imgObj.style.left = "0px";
        }

        function moveRight() {

            imgObj.style.left =
                parseInt(imgObj.style.left) + 5 + "px";

            animate = setTimeout(moveRight, 20);
        }

        function stop() {

            clearTimeout(animate);

            imgObj.style.left = "0px";
        }

        window.onload = init;

    </script>
</head>

<body>

    <h1>Moving Car</h1>

    <img id="img"
         src="car.webp"
         width="150"
         height="100">

    <br><br>

    <button onclick="moveRight()">Move</button>

    <button onclick="stop()">Stop</button>

</body>
</html>
